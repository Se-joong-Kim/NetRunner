services:
  backend:
    image: python:3.12-alpine
    working_dir: /srv
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./active.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
  client:
    image: python:3.12-alpine
    command: ["python", "-c", "import time; time.sleep(10**9)"]
