# 모든 실험망 컨테이너는 capability를 전부 내리고(cap_drop), 필요한 것만 다시 준다.
# 권한 상승은 막는다(no-new-privileges). 실험망 네트워크는 internal이라 외부로 나가지 못한다.
# 단, Windows Docker Desktop에서는 compose.windows.yaml이 internal을 끈다(#47).
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  router:
    <<: *hardened
    image: netrunner-lab
    build: ./lab
    command: [router]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      client_net:
        ipv4_address: 10.21.0.254
      server_net:
        ipv4_address: 10.20.0.254
  client:
    <<: *hardened
    image: netrunner-lab
    init: true
    command: [client]
    # NET_ADMIN: 경로 설정, NET_RAW: tcpdump
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      client_net:
        ipv4_address: 10.21.0.2
  dns:
    <<: *hardened
    image: netrunner-lab
    command: [dns]
    # NET_BIND_SERVICE: 53번 포트, SETUID·SETGID: dnsmasq가 dnsmasq 사용자로 낮추는 데 필요,
    # KILL: 낮춘 dnsmasq에 HUP을 보내 설정을 다시 읽게 한다(root 셸에서 보내려면 필요)
    cap_add: [NET_ADMIN, NET_BIND_SERVICE, SETUID, SETGID, KILL]
    networks:
      server_net:
        ipv4_address: 10.20.0.53
  alt-dns:
    <<: *hardened
    image: netrunner-lab
    command: [dns]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE, SETUID, SETGID, KILL]
    networks:
      server_net:
        ipv4_address: 10.20.0.54
  web:
    <<: *hardened
    image: netrunner-lab
    command: [web]
    # NET_ADMIN: T2, NET_BIND_SERVICE: 80번, SETUID·SETGID: httpd 권한 강하
    cap_add: [NET_ADMIN, NET_BIND_SERVICE, SETUID, SETGID, KILL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      server_net:
        ipv4_address: 10.20.0.10
  backend:
    <<: *hardened
    image: netrunner-lab
    init: true
    command: [backend]
    cap_add: [NET_ADMIN, SETUID, SETGID, KILL]
    networks:
      server_net:
        ipv4_address: 10.20.0.11
  blockpage:
    <<: *hardened
    image: netrunner-lab
    command: [blockpage]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    networks:
      server_net:
        ipv4_address: 10.20.0.12

networks:
  client_net:
    internal: true
    ipam:
      config:
        - subnet: 10.21.0.0/24
  server_net:
    internal: true
    ipam:
      config:
        - subnet: 10.20.0.0/24
