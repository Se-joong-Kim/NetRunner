services:
  router:
    image: netrunner-lab
    build: ./lab
    command: [router]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      client_net:
        ipv4_address: 10.21.0.254
      server_net:
        ipv4_address: 10.20.0.254
  client:
    image: netrunner-lab
    init: true
    command: [client]
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./captures:/captures
    networks:
      client_net:
        ipv4_address: 10.21.0.2
  dns:
    image: netrunner-lab
    command: [dns]
    cap_add: [NET_ADMIN]
    networks:
      server_net:
        ipv4_address: 10.20.0.53
  alt-dns:
    image: netrunner-lab
    command: [dns]
    cap_add: [NET_ADMIN]
    networks:
      server_net:
        ipv4_address: 10.20.0.54
  web:
    image: netrunner-lab
    command: [web]
    cap_add: [NET_ADMIN]
    networks:
      server_net:
        ipv4_address: 10.20.0.10

networks:
  client_net:
    ipam:
      config:
        - subnet: 10.21.0.0/24
  server_net:
    ipam:
      config:
        - subnet: 10.20.0.0/24
